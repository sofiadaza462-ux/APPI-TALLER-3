<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tienda ADSO</title>
<style>
body{font:14px system-ui;max-width:1000px;margin:40px auto;padding:0 20px;background:#0f172a;color:#e2e8f0}
a{color:#6366f1;font-weight:700;text-decoration:none}
.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:20px;margin-top:18px}
input{padding:10px;margin:4px;border-radius:10px;background:#0f172a;border:2px solid #334155;color:#e2e8f0;width:180px}
input.largo{width:320px}
button{padding:10px 14px;margin:4px;border-radius:10px;background:#6366f1;color:#fff;border:none;font-weight:800;cursor:pointer}
button.sec{background:transparent;border:2px solid #334155;color:#94a3b8}
button.warn{background:#ef4444}
table{width:100%;border-collapse:collapse;background:#0f172a;margin-top:12px;border-radius:10px;overflow:hidden}
th,td{padding:9px;border-bottom:1px solid #334155;text-align:left;font-size:13px}
.msg{color:#22c55e;font-weight:700;min-height:18px}
.muted{color:#94a3b8;font-size:12px}
</style>
</head>
<body>
<h1> Tienda ADSO</h1><a href="/docs">Abrir Swagger</a>

<!-- CLIENTES -->
<div class="card">
<h3>Clientes</h3>
<form id="form-guardar-cliente">
<input id="c-nombre" placeholder="Nombre" required>
<input id="c-correo" placeholder="Correo" required class="largo">
<button>Guardar Cliente</button>
</form>
<div style="margin-top:10px">
<input id="c-editar-id" type="number" placeholder="ID a editar">
<input id="c-editar-nombre" placeholder="Nuevo Nombre">
<input id="c-editar-correo" placeholder="Nuevo Correo" class="largo">
<button class="sec" id="btn-modificar-cliente">Modificar Cliente</button>
</div>
<div style="margin-top:10px">
<input id="c-buscar-id" type="number" placeholder="ID cliente">
<button class="sec" id="btn-buscar-cliente">Buscar Cliente</button>
<button class="sec" id="btn-listar-clientes">Listar Clientes</button>
<input id="c-pedidos-id" type="number" placeholder="ID cliente">
<button class="sec" id="btn-pedidos-cliente">Ver Pedidos del Cliente</button>
<input id="c-eliminar-id" type="number" placeholder="ID a eliminar">
<button class="warn" id="btn-eliminar-cliente">Eliminar Cliente</button>
</div>
<p class="msg" id="msg-c"></p>
<table><thead><tr><th>ID</th><th>Nombre</th><th>Correo</th></tr></thead><tbody id="filas-c"></tbody></table>
</div>

<!-- PRODUCTOS -->
<div class="card">
<h3>Productos</h3>
<form id="form-guardar-producto">
<input id="p-nombre" placeholder="Nombre" required>
<input id="p-precio" type="number" step="0.01" placeholder="Precio" required>
<input id="p-stock" type="number" placeholder="Stock" required>
<button>Guardar Producto</button>
</form>
<div style="margin-top:10px">
<input id="p-buscar-id" type="number" placeholder="ID producto">
<button class="sec" id="btn-buscar-producto">Buscar Producto</button>
<input id="p-buscar-nombre" placeholder="Nombre" class="largo">
<button class="sec" id="btn-buscar-nombre">Buscar por Nombre</button>
<button class="sec" id="btn-listar-productos">Listar Productos</button>
</div>
<div style="margin-top:10px">
<input id="p-mod-id" type="number" placeholder="ID">
<input id="p-mod-stock" type="number" placeholder="Nuevo Stock">
<button class="sec" id="btn-modificar-stock">Modificar Stock</button>
</div>
<p class="msg" id="msg-p"></p>
<table><thead><tr><th>ID</th><th>Nombre</th><th>Precio</th><th>Stock</th></tr></thead><tbody id="filas-p"></tbody></table>
</div>

<!-- PEDIDOS -->
<div class="card">
<h3>Pedidos</h3>
<div>
<input id="ped-cliente" type="number" placeholder="ID Cliente">
<input id="ped-prod" type="number" placeholder="ID Producto">
<input id="ped-cant" type="number" placeholder="Cantidad">
<button class="sec" id="btn-agregar-carrito">Agregar al carrito</button>
</div>
<div id="carrito" class="muted" style="margin:8px 0">Carrito vacío</div>
<button id="btn-guardar-pedido">Guardar Pedido</button>
<div style="margin-top:12px">
<input id="ped-buscar-id" type="number" placeholder="ID Pedido">
<button class="sec" id="btn-buscar-pedido">Buscar Pedido</button>
<button class="sec" id="btn-listar-pedidos">Listar Pedidos</button>
<input id="ped-cancelar-id" type="number" placeholder="ID a cancelar">
<button class="warn" id="btn-cancelar-pedido">Cancelar Pedido</button>
</div>
<p class="msg" id="msg-ped"></p>
<table><thead><tr><th>ID</th><th>Cliente</th><th>Total</th><th>Estado</th></tr></thead><tbody id="filas-ped"></tbody></table>
<pre id="detalle-ped"></pre>
</div>

<!-- REPORTES -->
<div class="card">
<h3>Reportes - Ventas por Cliente</h3>
<button id="btn-reporte-ventas">Generar Reporte de Ventas</button>
<p class="msg" id="msg-rep"></p>
<table><thead><tr><th>Cliente ID</th><th>Cliente</th><th>Total Pedidos</th><th>Total Gastado</th></tr></thead><tbody id="filas-rep"></tbody></table>
</div>

<script>
const $=id=>document.getElementById(id);
async function pedir(url,op){const r=await fetch(url,op); let d; try{d=await r.json();}catch{d={}} if(!r.ok) throw new Error(d.detail||JSON.stringify(d)); return d;}

function pintarClientes(data){$("filas-c").innerHTML=""; for(const c of data){const tr=document.createElement("tr"); tr.innerHTML="<td>"+c.id+"</td><td>"+c.nombre+"</td><td>"+c.correo+"</td>"; $("filas-c").appendChild(tr);}}
function pintarProductos(data){$("filas-p").innerHTML=""; for(const p of data){const tr=document.createElement("tr"); tr.innerHTML="<td>"+p.id+"</td><td>"+p.nombre+"</td><td>"+p.precio+"</td><td>"+p.stock+"</td>"; $("filas-p").appendChild(tr);}}
function pintarPedidos(data){$("filas-ped").innerHTML=""; for(const p of data){const cli=p.cliente||p.cliente_id||""; const tr=document.createElement("tr"); tr.innerHTML="<td>"+p.id+"</td><td>"+cli+"</td><td>$"+p.total+"</td><td>"+p.estado+"</td>"; $("filas-ped").appendChild(tr);}}

async function listarClientes(){try{pintarClientes(await pedir("/clientes"));}catch(e){$("msg-c").textContent=e.message;}}
async function listarProductos(){try{pintarProductos(await pedir("/productos"));}catch(e){$("msg-p").textContent=e.message;}}
async function listarPedidos(){try{pintarPedidos(await pedir("/pedidos"));}catch(e){$("msg-ped").textContent=e.message;}}

$("form-guardar-cliente").addEventListener("submit", async function(e){e.preventDefault(); try{await pedir("/clientes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nombre:$("c-nombre").value,correo:$("c-correo").value})}); $("form-guardar-cliente").reset(); await listarClientes(); $("msg-c").textContent="Cliente guardado";}catch(err){$("msg-c").textContent=err.message;}});
$("btn-modificar-cliente").addEventListener("click", async function(){try{const r=await pedir("/clientes/"+$("c-editar-id").value,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({nombre:$("c-editar-nombre").value,correo:$("c-editar-correo").value})}); pintarClientes([r]); $("msg-c").textContent="Cliente modificado";}catch(err){$("msg-c").textContent=err.message;}});
$("btn-listar-clientes").addEventListener("click", listarClientes);
$("btn-buscar-cliente").addEventListener("click", async function(){try{const c=await pedir("/clientes/"+$("c-buscar-id").value); pintarClientes([c]); $("msg-c").textContent="Cliente encontrado";}catch(e){$("msg-c").textContent=e.message;}});
$("btn-pedidos-cliente").addEventListener("click", async function(){try{const data=await pedir("/clientes/"+$("c-pedidos-id").value+"/pedidos"); $("filas-c").innerHTML=""; $("msg-c").textContent="Pedidos del cliente "+$("c-pedidos-id").value+": "+data.length; pintarPedidos(data); }catch(e){$("msg-c").textContent=e.message;}});
$("btn-eliminar-cliente").addEventListener("click", async function(){try{const r=await pedir("/clientes/"+$("c-eliminar-id").value,{method:"DELETE"}); $("msg-c").textContent=r.mensaje; await listarClientes();}catch(e){$("msg-c").textContent=e.message;}});

$("form-guardar-producto").addEventListener("submit", async function(e){e.preventDefault(); try{await pedir("/productos",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nombre:$("p-nombre").value,precio:$("p-precio").value,stock:Number($("p-stock").value)})}); $("form-guardar-producto").reset(); await listarProductos(); $("msg-p").textContent="Producto guardado";}catch(err){$("msg-p").textContent=err.message;}});
$("btn-listar-productos").addEventListener("click", listarProductos);
$("btn-buscar-producto").addEventListener("click", async function(){try{pintarProductos([await pedir("/productos/"+$("p-buscar-id").value)]); $("msg-p").textContent="Producto encontrado";}catch(e){$("msg-p").textContent=e.message;}});
$("btn-buscar-nombre").addEventListener("click", async function(){try{pintarProductos(await pedir("/productos?buscar="+encodeURIComponent($("p-buscar-nombre").value))); $("msg-p").textContent="Búsqueda lista";}catch(e){$("msg-p").textContent=e.message;}});
$("btn-modificar-stock").addEventListener("click", async function(){try{pintarProductos([await pedir("/productos/"+$("p-mod-id").value+"/stock?stock="+$("p-mod-stock").value,{method:"PATCH"})]); $("msg-p").textContent="Stock modificado";}catch(e){$("msg-p").textContent=e.message;}});

let carrito=[];
$("btn-agregar-carrito").addEventListener("click", function(){const pid=Number($("ped-prod").value); const cant=Number($("ped-cant").value); if(!pid||!cant) return; carrito.push({producto_id:pid,cantidad:cant}); $("carrito").textContent=carrito.map(function(i){return "Prod #"+i.producto_id+" x"+i.cantidad;}).join(", "); $("ped-prod").value=""; $("ped-cant").value="";});
$("btn-guardar-pedido").addEventListener("click", async function(){try{const data=await pedir("/pedidos",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({cliente_id:Number($("ped-cliente").value),items:carrito})}); carrito=[]; $("carrito").textContent="Carrito vacío"; $("msg-ped").textContent="Pedido "+data.id+" guardado $"+data.total; await listarPedidos();}catch(e){$("msg-ped").textContent=e.message;}});
$("btn-listar-pedidos").addEventListener("click", listarPedidos);
$("btn-buscar-pedido").addEventListener("click", async function(){try{const d=await pedir("/pedidos/"+$("ped-buscar-id").value); $("detalle-ped").textContent=JSON.stringify(d,null,2);}catch(e){$("msg-ped").textContent=e.message;}});
$("btn-cancelar-pedido").addEventListener("click", async function(){try{const r=await pedir("/pedidos/"+$("ped-cancelar-id").value+"/cancelar",{method:"POST"}); $("msg-ped").textContent=r.mensaje; await listarPedidos();}catch(e){$("msg-ped").textContent=e.message;}});

$("btn-reporte-ventas").addEventListener("click", async function(){
  try{
    const data=await pedir("/reportes/ventas-por-cliente");
    $("filas-rep").innerHTML="";
    for(const r of data){
      const tr=document.createElement("tr");
      tr.innerHTML="<td>"+r.cliente_id+"</td><td>"+r.cliente+"</td><td>"+r.total_pedidos+"</td><td>$"+r.total_gastado+"</td>";
      $("filas-rep").appendChild(tr);
    }
    $("msg-rep").textContent="Reporte generado: "+data.length+" clientes";
  }catch(e){$("msg-rep").textContent=e.message;}
});

listarClientes(); listarProductos(); listarPedidos();
</script>
</body>
</html>
